[project]

use_directory_urls = false

site_name = "satterc"
site_description = "Composable models of the terrestrial carbon and water cycles, for conduit pipelines."
site_author = "Joe Marsh Rossney"
site_url = "https://satterc.github.io/satterc"

repo_name = "SatTerC/satterc"
repo_url = "https://github.com/SatTerC/satterc"

copyright = "Copyright &copy; 2026 The authors"

nav = [
  { "Home" = "index.md" },
  { "Guides" = [
      "guides/installation.md",
      "guides/quickstart.md",
  ]},
  { "Models" = [
      "models/index.md",
      "models/splash.md",
      "models/pmodel.md",
      "models/sgam.md",
      "models/rothc.md",
  ]},
  { "Recipes" = [
      "recipes/my_first_pipeline.md",
      "recipes/full_pipeline.md",
      "recipes/soil_moisture.md",
      "recipes/pft_parameters.md",
  ]},
  { "Reference" = [
      "reference/index.md",
      "reference/cli.md",
      "reference/python-api.md",
      { "Modules" = [
          "reference/modules/satterc.models/splash.md",
          "reference/modules/satterc.models/pmodel.md",
          "reference/modules/satterc.models/sgam.md",
          "reference/modules/satterc.models/rothc.md",
          "reference/modules/satterc.scaffold/config_gen.md",
          "reference/modules/satterc.scaffold/bridges.md",
          "reference/modules/satterc.scaffold/data_gen/generate.md",
          "reference/modules/satterc.scaffold/data_gen/spec.md",
          "reference/modules/satterc.scaffold/data_gen/daily.md",
          "reference/modules/satterc.scaffold/data_gen/static.md",
          "reference/modules/satterc.scaffold/data_gen/fallback.md",
          "reference/modules/satterc.temporal.md",
      ]},
  ]},
]

# Katex
extra_javascript = [
    "_static/js/marimo-button.js",
    "_static/js/katex.js",
    "https://unpkg.com/katex@0/dist/katex.min.js",
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
    "assets/termynal.js",
]
extra_css = [
    "_static/css/extra.css",
    "https://unpkg.com/katex@0/dist/katex.min.css",
    "assets/termynal.css",
]

[project.theme]
language = "en"
custom_dir = "overrides"
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"


# Extensions
# ----------
# https://zensical.org/docs/setup/extensions/

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.blocks.admonition]
[project.markdown_extensions.pymdownx.blocks.details]
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]

# mkdocs-typer2
[project.markdown_extensions.tables]
[project.markdown_extensions."mkdocs_typer2.markdown:makeExtension"]
pretty = false
engine = "native"

# Mkdocstrings
# ------------

[project.plugins.mkdocstrings]
custom_templates = "docs_tools/templates"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
annotations_path = "brief"
docstring_style = "numpy"
docstring_section_style = "list"
inherited_members = true
members_order = "source"
line_length = 88
merge_init_into_class = true
separate_signature = true
show_signature = true
signature_crossrefs = true
show_signature_annotations = true
show_if_no_docstring = false
show_root_full_path = true
show_root_heading = true
show_root_members_full_path = false
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true

[[project.plugins.mkdocstrings.handlers.python.options.extensions]]
"docs_tools/units.py" = { }

