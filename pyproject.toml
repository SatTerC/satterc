[build-system]
requires = ["uv_build>=0.8.10,<0.9.0"]
build-backend = "uv_build"

[project]
name = "satterc"
version = "0.7.0"
description = "Carbon-cycle model modules for conduit pipelines."
authors = [
    { name = "jmarshrossney", email = "17361029+jmarshrossney@users.noreply.github.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 2 - Pre-Alpha"]
requires-python = ">=3.13"
dependencies = [
    "conduit[cli,geo,viz]",
    "numpy>=2.4.2",
    "xarray>=2026.2.0",
    "xarray-annotated>=0.6.0",
    "typer>=0.24.1",
    # pyrealm is capped below 3 in case their units change
    "pyrealm>=2.0.0,<3",
    "rothc-py",
    "sgam",
]

[project.scripts]
satterc = "satterc.cli:main"

# Registering the model modules under conduit's entry-point group makes each one
# addressable by a bare section name, so a config writes `[splash]` with no
# `_import_path`. The section name and the model name are deliberately the same.
[project.entry-points."conduit.modules"]
splash = "satterc.models.splash"
pmodel = "satterc.models.pmodel"
sgam = "satterc.models.sgam"
rothc = "satterc.models.rothc"

[project.urls]
Homepage = "https://SatTerC.github.io/satterc"
Repository = "https://github.com/SatTerC/satterc"
Documentation = "https://SatTerC.github.io/satterc"

[dependency-groups]
dev = [
    {include-group = "docs"},
    {include-group = "test"},
    "pre-commit>=4.5.1",
    "pyright>=1.1.409",
    "ruff>=0.15.4",
    "rust-just>=1.46.0",
]
docs = [
    {include-group = "recipes"},
    "marimo>=0.23.0",
    "marimo-md-export>=0.5.2",
    "mkdocstrings-python>=2.0.3",
    "zensical>=0.0.24",
    "mkdocs-typer2[termynal]>=0.4.1",
]
recipes = [
    "matplotlib>=3.10.8",
]
test = [
    "coverage>=7.13.5",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]

[tool.uv]
exclude-newer = "1 week"
exclude-newer-package = { marimo-md-export = false , xarray-annotated = false , conduit = false , sgam = false , rothc-py = false }

[tool.uv.sources]
rothc-py = { git = "https://github.com/SatTerC/rothc_py.git" }
sgam = { git = "https://github.com/SatTerC/sgam.git" }
conduit = { git = "https://github.com/NERC-CEH/conduit" }

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src/", "tests/"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "D",   # pydocstyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "PT",  # flake8-pytest-style
    "I",   # isort
]

[tool.ruff.lint.per-file-ignores]
# Except tests and scripts from docstring requirements
"tests/**" = ["D", "E501"]
"scripts/**" = ["D"]
# Typer CLI modules use typer.Option() in function signatures as standard practice.
"src/satterc/cli/**" = ["B008"]
# Marimo recipe notebooks use bare expressions for display output (B018),
# contain prose that naturally exceeds 88 chars (E501),
# include academic citations with en dashes (RUF001),
# may have unused variables from exploratory cells (F841),
# use scientific notation with Greek letters (RUF003),
# and are exploratory notebooks without module docstrings (D100, D401).
"recipes/**" = ["B018", "E501", "F841", "RUF001", "RUF003", "D100", "D401"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'where' used without 'out':UserWarning",
    # Ignore warnings from pyrealm
    "ignore:\\s*Pyrealm 2\\.0\\.0 uses a new default.*:UserWarning",
    "ignore::pyrealm.core.experimental.ExperimentalFeatureWarning",
    "ignore:Setting the shape on a NumPy array:DeprecationWarning",
    "ignore:The 'generic' unit for NumPy timedelta is deprecated:DeprecationWarning",
    "ignore:Class-scoped fixture defined as instance method:DeprecationWarning",
]
